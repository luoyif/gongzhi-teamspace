name: public-source-checks
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q app/teamspace app/deployment
      - run: |
          node --check app/web/app.js
          node --check app/web/voice-ui.mjs
          node --test app/tests/test_*.mjs
      - run: |
          ! git ls-files | grep -E '(^|/)(data|backups|secrets|upstream|evidence)/|[.]key$|[.]db$'
